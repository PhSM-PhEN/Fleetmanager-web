<div class="date-time-picker" #trigger>

    <!-- =====================================================
     CAMPO (digitável + ícone separado)
     ===================================================== -->

    <div class="picker-field" [class.open]="aberto" [class.disabled]="desabilitado">

        <input type="text" class="picker-input" [placeholder]="placeholder" [(ngModel)]="textoDigitado"
            [disabled]="desabilitado" (input)="onTextoDigitado($any($event.target).value)" (blur)="onTextoBlur()" />

        <button type="button" class="picker-icon-button" [disabled]="desabilitado" (click)="alternarCalendario()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="17" rx="3"></rect>
                <path d="M8 2v4"></path>
                <path d="M16 2v4"></path>
                <path d="M3 9h18"></path>
            </svg>
        </button>

    </div>


    <!-- =====================================================
     CALENDÁRIO (movido pro <body> em ngAfterViewInit)
     ===================================================== -->

    <div class="picker-panel" #panel [class.panel-open]="aberto">

        @if (aberto) {

        <div class="calendar-header">
            <div class="month-title">{{ mesAnoFormatado }}</div>

            <div class="month-navigation">
                <button type="button" class="navigation-button" aria-label="Mês anterior" (click)="mesAnterior()">
                    <svg viewBox="0 0 24 24">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                </button>

                <button type="button" class="navigation-button" aria-label="Próximo mês" (click)="proximoMes()">
                    <svg viewBox="0 0 24 24">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="picker-body">

            <div class="calendar-section">

                <div class="week-days">
                    @for (dia of ['D', 'S', 'T', 'Q', 'Q', 'S', 'S']; track $index) {
                    <span>{{ dia }}</span>
                    }
                </div>

                <div class="calendar-grid">
                    @for (day of diasCalendario; track day.date.getTime()) {
                    <button type="button" class="calendar-day" [class.other-month]="!day.currentMonth"
                        [class.today]="day.today" [class.selected]="day.selected" (click)="selecionarDia(day)">
                        {{ day.day }}
                    </button>
                    }
                </div>

                <div class="calendar-footer">
                    <button type="button" class="text-button clear" (click)="limpar()">Limpar</button>
                    <button type="button" class="text-button today-button" (click)="selecionarHoje()">Hoje</button>
                </div>

            </div>

            <div class="time-section">
                <div class="time-header">Horário</div>

                <div class="time-selector">

                    <div class="time-column">
                        <span class="time-label">H</span>
                        <div class="time-list">
                            @for (hora of horas; track hora) {
                            <button type="button" class="time-option" [class.selected]="hora === horaEdicao"
                                (click)="selecionarHora(hora)">
                                {{ hora.toString().padStart(2, '0') }}
                            </button>
                            }
                        </div>
                    </div>

                    <span class="time-separator">:</span>

                    <div class="time-column">
                        <span class="time-label">MIN</span>
                        <div class="time-list">
                            @for (minuto of minutos; track minuto) {
                            <button type="button" class="time-option" [class.selected]="minuto === minutoEdicao"
                                (click)="selecionarMinuto(minuto)">
                                {{ minuto.toString().padStart(2, '0') }}
                            </button>
                            }
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <div class="picker-actions">
            <button type="button" class="cancel-button" (click)="fechar()">Cancelar</button>
            <button type="button" class="apply-button" [disabled]="!dataEdicao" (click)="aplicar()">Aplicar</button>
        </div>

        }

    </div>

</div>
