<div class="modal-overlay">
  <div class="modal-content">

    <h2>Novo veículo</h2>

    <form [formGroup]="veiculoForm" (submit)="onFormSubmit($event)">

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="brand">Marca</label>
          <input id="brand" type="text" formControlName="brand" placeholder="Ex: Toyota" />
        </div>

        <div class="form-group">
          <label for="model">Modelo</label>
          <input id="model" type="text" formControlName="model" placeholder="Ex: Corolla" />
        </div>
      </div>

      <div class="form-row two-columns">
       <div class="form-group">
        <label for="manufacturingYear">Ano de fabricação/modelo</label>
        <input
            id="manufacturingYear"
            type="text"
            formControlName="manufacturingYear"
            placeholder="2024/2025"
        />
        @if (veiculoForm.controls.manufacturingYear.invalid && veiculoForm.controls.manufacturingYear.touched) {
            <span class="field-error">Use o formato ANO/ANO, ex: 2024/2025</span>
        }
        </div>

        <div class="form-group">
          <label for="color">Cor</label>
          <input id="color" type="text" formControlName="color" placeholder="Ex: Prata" />
        </div>
      </div>

      <div class="form-group">
        <label for="licensePlate">Placa</label>
        <input id="licensePlate" type="text" formControlName="licensePlate" placeholder="ABC1D23" />
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="renavam">RENAVAM</label>
          <input id="renavam" type="text" formControlName="renavam" />
        </div>

        <div class="form-group">
          <label for="chassiNumber">Número do chassi</label>
          <input id="chassiNumber" type="text" formControlName="chassiNumber" />
        </div>
      </div>

      <div class="form-group">
        <label for="currentMileage">Quilometragem atual</label>
        <input id="currentMileage" type="number" formControlName="currentMileage" />
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="companyId">Empresa</label>
          <select id="companyId" formControlName="companyId">
            <option [ngValue]="null">Selecione uma empresa</option>
            @for (empresa of empresas(); track empresa.id) {
              <option [ngValue]="empresa.id">{{ empresa.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="rentalPlanId">Plano de locação</label>
          <select id="rentalPlanId" formControlName="rentalPlanId">
            <option [ngValue]="null">Selecione um plano</option>
            @for (plano of planos(); track plano.id) {
              <option [ngValue]="plano.id">{{ plano.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" (click)="onCancelar()">Cancelar</button>
        <button type="submit" [disabled]="veiculoForm.invalid">Salvar</button>
      </div>

    </form>

  </div>
</div>
