<div class="modal-overlay">
  <div class="modal-content">

    @if (!preview()) {

      <h2>Novo contrato</h2>

      <form [formGroup]="previewForm">

        <div class="form-row two-columns">
          <div class="form-group">
            <label for="vehicleId">Veículo</label>
            <select id="vehicleId" formControlName="vehicleId">
              <option [ngValue]="null">Selecione um veículo</option>
              @for (veiculo of veiculos(); track veiculo.id) {
                <option [ngValue]="veiculo.id">{{ veiculo.brand }} {{ veiculo.model }} — {{ veiculo.licensePlate }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="tenantId">Cliente</label>
            <select id="tenantId" formControlName="tenantId">
              <option [ngValue]="null">Selecione um cliente</option>
              @for (cliente of clientes(); track cliente.id) {
                <option [ngValue]="cliente.id">{{ cliente.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-row two-columns">
          <div class="form-group">
            <label for="rentalType">Tipo de locação</label>
            <select id="rentalType" formControlName="rentalType">
              <option value="">Selecione</option>
              <option value="Daily">Diária</option>
              <option value="Monthly">Mensal</option>
            </select>
          </div>

          <div class="form-group">
            <label for="desiredExcessMileage">Km excedente desejado</label>
            <input id="desiredExcessMileage" type="number" formControlName="desiredExcessMileage" />
          </div>
        </div>

        <div class="form-row two-columns">
          <div class="form-group">
            <label for="pickupDateTime">Data/hora de retirada</label>
            <input id="pickupDateTime" type="datetime-local" formControlName="pickupDateTime" />
          </div>

          <div class="form-group">
            <label for="returnDueDateTime">Data/hora prevista de devolução (opcional)</label>
            <input id="returnDueDateTime" type="datetime-local" formControlName="returnDueDateTime" />
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" (click)="onCancelar()">Cancelar</button>
          <button type="button" [disabled]="previewForm.invalid" (click)="gerarPreview()">Calcular orçamento</button>
        </div>

      </form>

    } @else {

      <h2>Confirmar contrato</h2>

      @if (preview(); as p) {

        <div class="detail-grid">
          <div class="detail-item">
            <span class="label">Tipo</span>
            <span class="value">{{ p.rentalType === 'Daily' ? 'Diária' : 'Mensal' }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Total de dias</span>
            <span class="value">{{ p.totalDays }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Km contratado</span>
            <span class="value">{{ p.mileageContracted }} km</span>
          </div>
          <div class="detail-item highlight">
            <span class="label">Valor total</span>
            <span class="value">{{ p.totalAmount | currency:'BRL' }}</span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" (click)="voltarParaEdicao()">Voltar</button>
          <button type="button" (click)="confirmarContrato()">Confirmar contrato</button>
        </div>

      }

    }

  </div>
</div>
