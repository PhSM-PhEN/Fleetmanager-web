<div class="page">

  <div class="page-header">
    <button type="button" class="back-button" (click)="onCancelar()" aria-label="Voltar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>

    <div>
      <h1>Novo contrato</h1>
      <p>Cadastre um novo contrato de locação.</p>
    </div>
  </div>

  <div class="content-card">
    <h2>Dados da locação</h2>

    <form [formGroup]="contractForm" (submit)="onFormSubmit($event)">

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="vehicleId">Veículo</label>
          <select id="vehicleId" formControlName="vehicleId">
            <option [ngValue]="null">Selecione o veículo</option>
            @for (veiculo of veiculos(); track veiculo.id) {
              <option [ngValue]="veiculo.id">{{ veiculo.brand }} {{ veiculo.model }} — {{ veiculo.licensePlate }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="tenantId">Cliente</label>
          <select id="tenantId" formControlName="tenantId">
            <option [ngValue]="null">Selecione o cliente</option>
            @for (cliente of clientes(); track cliente.id) {
              <option [ngValue]="cliente.id">{{ cliente.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="rentalPlanId">Plano de locação</label>
          <select id="rentalPlanId" formControlName="rentalPlanId">
            <option [ngValue]="null">Selecione o plano</option>
            @for (plano of planos(); track plano.id) {
              <option [ngValue]="plano.id">{{ plano.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="rentalType">Tipo de locação</label>
          <select id="rentalType" formControlName="rentalType">
            <option value="Daily">Diária</option>
            <option value="Monthly">Mensal</option>
          </select>
        </div>
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="pickupDateTime">Data e hora de retirada</label>
          <input id="pickupDateTime" type="datetime-local" formControlName="pickupDateTime" />
        </div>

        <div class="form-group">
          <label for="returnDueDateTime">Data e hora prevista de devolução</label>
          <input id="returnDueDateTime" type="datetime-local" formControlName="returnDueDateTime" />
        </div>
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label for="mileageContracted">Quilometragem contratada (km)</label>
          <input id="mileageContracted" type="number" formControlName="mileageContracted" placeholder="Ex: 500" />
        </div>

        <div class="form-group">
          <label for="totalAmount">Valor total (R$)</label>
          <input id="totalAmount" type="number" step="0.01" formControlName="totalAmount" placeholder="Ex: 1500.00" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="secondary" (click)="onCancelar()">Cancelar</button>
        <button type="submit" class="primary" [disabled]="contractForm.invalid">Salvar contrato</button>
      </div>

    </form>
  </div>

</div>
