<div class="app-layout">

  <app-toast />

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->
  <aside class="sidebar" [class.collapsed]="sidebarRecolhida()">

    <!-- Logo / Identidade -->

    <div class="sidebar-brand">

      <div class="brand-icon">

        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

          <path
            d="M5 17H4C3.45 17 3 16.55 3 16V12.5C3 11.67 3.67 11 4.5 11H5L7.2 5.5C7.5 4.6 8.35 4 9.3 4H14.7C15.65 4 16.5 4.6 16.8 5.5L19 11H19.5C20.33 11 21 11.67 21 12.5V16C21 16.55 20.55 17 20 17H19"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

          <path d="M5 17V19C5 19.55 5.45 20 6 20H7C7.55 20 8 19.55 8 19V17" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" />

          <path d="M16 17V19C16 19.55 16.45 20 17 20H18C18.55 20 19 19.55 19 19V17" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" />

          <circle cx="7.5" cy="13.5" r="1" fill="currentColor" />

          <circle cx="16.5" cy="13.5" r="1" fill="currentColor" />

        </svg>

      </div>


      <div class="brand-info">

        <h2>FleetManager</h2>

      </div>

    </div>


    <!-- =====================================================
         MENU PRINCIPAL
    ====================================================== -->

    <nav class="sidebar-nav">

      <!-- Dashboard -->

      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" title="Dashboard">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <rect x="4" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.7" />

            <rect x="14" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.7" />

            <rect x="4" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.7" />

            <rect x="14" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.7" />

          </svg>

        </span>

        <span>Dashboard</span>

      </a>


      <!-- =====================================================
           GESTÃO
      ====================================================== -->

      <span class="nav-section-title">
        GESTÃO
      </span>


      <!-- Veículos -->

      <a routerLink="/vehicles" routerLinkActive="active" class="nav-item" title="Veículos">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path
              d="M5 17H4C3.45 17 3 16.55 3 16V12.5C3 11.67 3.67 11 4.5 11H5L7.2 5.5C7.5 4.6 8.35 4 9.3 4H14.7C15.65 4 16.5 4.6 16.8 5.5L19 11H19.5C20.33 11 21 11.67 21 12.5V16C21 16.55 20.55 17 20 17H19"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

            <circle cx="7" cy="16" r="1.5" stroke="currentColor" stroke-width="1.7" />

            <circle cx="17" cy="16" r="1.5" stroke="currentColor" stroke-width="1.7" />

          </svg>

        </span>

        <span>Veículos</span>

      </a>


      <!-- Contratos -->

      <a routerLink="/contracts" routerLinkActive="active" class="nav-item" title="Contratos">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.7" />

            <path d="M8 8H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M8 12H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M8 16H13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

          </svg>

        </span>

        <span>Contratos</span>

      </a>


      <!-- Clientes -->

      <a routerLink="/clients" routerLinkActive="active" class="nav-item" title="Clientes">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.7" />

            <path d="M5 20C5 16.69 8.13 14 12 14C15.87 14 19 16.69 19 20" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

          </svg>

        </span>

        <span>Clientes</span>

      </a>


      <!-- Planos -->

      <a routerLink="/rental-plans" routerLinkActive="active" class="nav-item" title="Planos de Locação">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M12 3L20 7.5V16.5L12 21L4 16.5V7.5L12 3Z" stroke="currentColor" stroke-width="1.7"
              stroke-linejoin="round" />

            <path d="M12 8V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M8.5 10L12 12L15.5 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" />

          </svg>

        </span>

        <span>Planos de Locação</span>

      </a>


      <!-- Empresas -->

      <a routerLink="/companies" routerLinkActive="active" class="nav-item" title="Empresas">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.7" />

            <path d="M8 9H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M14 9H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M8 13H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M14 13H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M10 20V17H14V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

          </svg>

        </span>

        <span>Empresas</span>

      </a>


      <!-- Ocorrências -->

      <a routerLink="/incident-reports" routerLinkActive="active" class="nav-item" title="Ocorrências">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M12 9V13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <circle cx="12" cy="16.5" r="0.5" fill="currentColor" />

            <path
              d="M10.29 3.86L1.82 18C1.64 18.32 1.55 18.68 1.55 19.05C1.55 20.13 2.42 21 3.5 21H20.5C20.87 21 21.23 20.91 21.55 20.73C22.48 20.2 22.8 19.02 22.27 18.09L13.71 3.86C13.53 3.53 13.27 3.26 12.95 3.08C12.02 2.55 10.84 2.87 10.29 3.86Z"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />

          </svg>

        </span>

        <span>Ocorrências</span>
      </a>


      <!-- =====================================================
           CONFIGURAÇÕES
      ====================================================== -->

      <span class="nav-section-title">
        CONFIGURAÇÕES
      </span>


      <!-- Usuários (em breve) -->

      <span class="nav-item disabled" title="Usuários — em breve">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7" />

            <path d="M3 20C3 16.69 5.69 14 9 14C12.31 14 15 16.69 15 20" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

            <path d="M16 8.5C17.1 8.5 18 7.6 18 6.5C18 5.4 17.1 4.5 16 4.5" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

            <path d="M18 14.2C19.79 14.6 21 15.9 21 18" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

          </svg>

        </span>

        <span>Usuários</span>

      </span>


      <!-- Meu Perfil (em breve) -->

      <span class="nav-item disabled" title="Meu Perfil — em breve">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.7" />

            <path d="M5 20C5 16.4 8.13 13.5 12 13.5C15.87 13.5 19 16.4 19 20" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

          </svg>

        </span>

        <span>Meu Perfil</span>

      </span>


      <!-- Sair -->

      <button type="button" class="nav-item logout-item" (click)="sair()" title="Sair">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M10 5H6C5.45 5 5 5.45 5 6V18C5 18.55 5.45 19 6 19H10" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

            <path d="M13 8L17 12L13 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" />

            <path d="M17 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

          </svg>

        </span>

        <span>Sair</span>

      </button>

    </nav>

  </aside>


  <!-- =====================================================
       ÁREA PRINCIPAL
  ====================================================== -->

  <div class="main-area" [class.expanded]="sidebarRecolhida()">


    <!-- ===================================================
         TOPBAR
    ==================================================== -->

    <header class="topbar">

      <div class="topbar-left">

        <button type="button" class="menu-toggle" aria-label="Recolher menu" (click)="alternarSidebar()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>

        <span class="page-system">
          {{ tituloPagina() }}
        </span>

      </div>


      <div class="topbar-right">


        <!-- Notificações -->

        <button type="button" class="notification-button" aria-label="Notificações">

          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M18 9C18 5.69 15.31 3 12 3C8.69 3 6 5.69 6 9C6 15 3.5 15 3.5 17H20.5C20.5 15 18 15 18 9Z"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />

            <path d="M10 20C10.5 20.65 11.2 21 12 21C12.8 21 13.5 20.65 14 20" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />

          </svg>

          <span class="notification-dot">3</span>

        </button>


        <!-- Usuário -->

        <div class="user-profile">

          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.7" />
              <path d="M5 20C5 16.4 8.13 13.5 12 13.5C15.87 13.5 19 16.4 19 20" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
            </svg>
          </div>

          <div class="user-info">

            <strong>
              {{ nomeUsuario }}
            </strong>

            <span>
              Administrador
            </span>

          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================
         CONTEÚDO DAS ROTAS
    ====================================================== -->

    <main class="content">

      <router-outlet />

    </main>

  </div>

</div>
